# Parser for Zift SFTP audit JSONL logs.
#
# Install path: /etc/crowdsec/parsers/s01-parse/zift-logs.yaml
#
# Reads lines collected by the acquisition labeled `type: zift` and
# extracts the structured fields from the Zift audit JSON object.
#
# Field extraction is by JSON key name, NOT by regex on field order.
# Zift's audit code (src/zift/audit.zig) fixes the wire order at
# `time, event, user, operation, result, path, detail, ip` so the
# shipped fail2ban regex can anchor on field positions, but CrowdSec
# expressions can use the JSON parser directly — which is robust to
# any future reordering.
#
# Outputs:
#   evt.Meta.service          = "zift"
#   evt.Meta.source_ip        = <client IP, always present>
#   evt.Meta.zift_user        = <virtual username, when present>
#   evt.Meta.zift_operation   = <full operation string, e.g. "auth.password">
#   evt.Meta.zift_result      = "ok" | "denied" | "failed"
#   evt.Meta.zift_detail      = <short reason, e.g. "bad password">
#   evt.Meta.log_type         = "zift_auth_fail" | "zift_conn_fail" | "zift_audit"
#
# The `log_type` normalization is what the bundled scenarios filter on.
# `zift_auth_fail`  — denied/failed at auth.{password,publickey} or
#                     auth.too_many_attempts. These are ban-worthy.
# `zift_conn_fail`  — denied/failed at accept.rejected or
#                     handshake.failed. Pre-auth; may be legitimate
#                     traffic spikes, so the shipped scenario for
#                     this category alerts but does not ban by default.
# `zift_audit`      — everything else (ok results, policy denials on
#                     authenticated file ops, idle.timeout, etc.).
#                     Available for custom scenarios but not bucketed
#                     by the shipped ones, because an authenticated
#                     partner hitting `deny **.exe` is not abuse.

name: shreeve/zift-logs
description: "Parse Zift SFTP audit JSONL"

filter: |
  evt.Line.Labels.type == "zift" &&
  JsonExtract(evt.Line.Raw, "event") == "zift.audit"

onsuccess: next_stage

statics:
  - meta: service
    value: zift

  - meta: source_ip
    expression: JsonExtract(evt.Line.Raw, "ip")

  - meta: zift_user
    expression: JsonExtract(evt.Line.Raw, "user")

  - meta: zift_operation
    expression: JsonExtract(evt.Line.Raw, "operation")

  - meta: zift_result
    expression: JsonExtract(evt.Line.Raw, "result")

  - meta: zift_detail
    expression: JsonExtract(evt.Line.Raw, "detail")

  # Use Zift's own RFC 3339 millisecond timestamp as the event time
  # rather than file mtime. Matches the `datepattern` line shipped
  # in packaging/fail2ban/zift-filter.conf and gives buckets the
  # right time when log shipping defers writes.
  - target: evt.StrTime
    expression: JsonExtract(evt.Line.Raw, "time")

  - target: evt.StrTimeFormat
    value: "2006-01-02T15:04:05.000Z"

# Two narrow follow-up nodes set `log_type` based on the operation
# category. Splitting them avoids a giant ternary in `statics` above
# and makes each rule individually grep-able.
nodes:
  - filter: |
      JsonExtract(evt.Line.Raw, "result") in ["denied", "failed"] &&
      JsonExtract(evt.Line.Raw, "operation") in [
        "auth.password",
        "auth.publickey",
        "auth.too_many_attempts"
      ]
    statics:
      - meta: log_type
        value: zift_auth_fail

  - filter: |
      JsonExtract(evt.Line.Raw, "result") in ["denied", "failed"] &&
      JsonExtract(evt.Line.Raw, "operation") in [
        "accept.rejected",
        "handshake.failed"
      ]
    statics:
      - meta: log_type
        value: zift_conn_fail

  # Fall-through bucket: keep the line parsed and tagged so operators
  # writing custom scenarios can reach it, but don't classify it as
  # something the shipped scenarios will act on.
  - filter: |
      evt.Meta.log_type == ""
    statics:
      - meta: log_type
        value: zift_audit
