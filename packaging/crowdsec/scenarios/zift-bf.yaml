# Fast brute-force scenario for Zift authentication failures.
#
# Install path: /etc/crowdsec/scenarios/zift-bf.yaml
#
# Bucket fills on every auth-layer denied/failed event (the parser
# tags those as log_type=zift_auth_fail). Five tokens with a 2-minute
# leak roughly matches fail2ban's traditional `maxretry=5,findtime=600`
# tuning that ships in packaging/fail2ban/zift-jail.conf, while staying
# CrowdSec-native (the leaky-bucket has a memory of past failures
# rather than a hard 10-minute window edge).
#
# `blackhole: 5m` is the cooldown that suppresses a re-fire after the
# bucket overflows. It is NOT the ban duration — that is decided in
# /etc/crowdsec/profiles.yaml by the operator and applied by the
# bouncer. To map the historical 1-hour fail2ban ban, leave the
# default crowdsec profile (which bans for 4 hours) or shorten it.

type: leaky
name: shreeve/zift-bf
description: "Detect Zift SFTP authentication brute force"

filter: |
  evt.Meta.log_type == "zift_auth_fail" &&
  evt.Meta.source_ip != ""

groupby: evt.Meta.source_ip
distinct: evt.Meta.source_ip

capacity: 5
leakspeed: 2m
blackhole: 5m

labels:
  service: zift
  type: bruteforce
  remediation: true
  classification:
    - attack.T1110
