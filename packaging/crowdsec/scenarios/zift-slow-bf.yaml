# Slow brute-force scenario for Zift authentication failures.
#
# Install path: /etc/crowdsec/scenarios/zift-slow-bf.yaml
#
# Companion to zift-bf.yaml. Catches credential-stuffing or
# probing that paces itself below the fast-BF threshold: ~30
# auth failures spread over a couple of hours from one IP. This
# is the kind of pattern that flies under fail2ban's fixed window
# but the leaky-bucket retains memory of.
#
# Conservative defaults — a misconfigured partner with a stale
# password set on a polling cron job is the most likely real-world
# trigger, and 30 failures over hours is enough rope to make that
# diagnostic instead of an outage.

type: leaky
name: shreeve/zift-slow-bf
description: "Detect Zift SFTP slow brute force / credential probing"

filter: |
  evt.Meta.log_type == "zift_auth_fail" &&
  evt.Meta.source_ip != ""

groupby: evt.Meta.source_ip
distinct: evt.Meta.source_ip

capacity: 30
leakspeed: 5m
blackhole: 30m

labels:
  service: zift
  type: bruteforce
  remediation: true
  classification:
    - attack.T1110
    - attack.T1110.003
