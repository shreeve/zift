# CrowdSec collection that bundles the Zift parser + scenarios.
#
# Install path: /etc/crowdsec/collections/zift.yaml
#
# This file is a manifest, not configuration. The parser and scenario
# files it references must also be installed (see README.md in this
# directory). When this package is published to the CrowdSec Hub,
# `cscli collections install shreeve/zift` will pull every component
# referenced below in one command.

name: shreeve/zift
description: "Zift SFTP server: log parser and authentication-abuse scenarios"
author: shreeve

parsers:
  - shreeve/zift-logs

scenarios:
  - shreeve/zift-bf
  - shreeve/zift-slow-bf
  - shreeve/zift-dos
