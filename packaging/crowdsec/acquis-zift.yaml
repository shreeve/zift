# CrowdSec acquisition config for Zift.
#
# Install path: /etc/crowdsec/acquis.d/zift.yaml
# Owner/mode:   root:root, 0644
#
#   sudo install -m 0644 acquis-zift.yaml /etc/crowdsec/acquis.d/zift.yaml
#   sudo systemctl reload crowdsec
#
# Adjust `filenames` if your zift.conf points `log` somewhere other
# than /home/zift/audit.jsonl. The `labels.type: zift` value is the
# hook the parser at packaging/crowdsec/parsers/s01-parse/zift-logs.yaml
# uses to claim these lines, so do not change it without also editing
# the parser's `filter:` expression.
#
# Zift emits a `truncated:true` marker rather than wrapping or splitting
# oversized audit lines, so the default `multiline` is unnecessary.

filenames:
  - /home/zift/audit.jsonl

labels:
  type: zift
