# logrotate rule for Zift's audit log.
#
# Install path: /etc/logrotate.d/zift
#
#   sudo install -m 0644 deploy/logrotate-zift.conf /etc/logrotate.d/zift
#
# Verify it parses + dry-run:
#   sudo logrotate -d /etc/logrotate.d/zift
#
# Force a rotation (useful for testing the SIGUSR1 reopen handshake):
#   sudo logrotate -fv /etc/logrotate.d/zift
#
# After a forced rotation:
#   - /home/zift/audit.jsonl should exist and be empty (fresh fd)
#   - /home/zift/audit.jsonl.1 (or .gz) holds the previous content
#   - the journal should show "audit log reopened" (or similar) on the
#     next zift line, confirming SIGUSR1 reached the process

/home/zift/audit.jsonl {
    daily
    rotate 30
    compress
    missingok
    notifempty
    # `create` ensures the post-rotate fresh file lands at the
    # ownership + mode the deploy expects: zift owns it (so the
    # daemon can write), group `zift` reads (operator forensics),
    # world has nothing. Without this directive, logrotate would
    # use whatever default ownership the rotation runs under
    # (typically root:root, mode 0644), which would either break
    # daemon writes or expose the audit log to other local users.
    create 0640 zift zift
    # SIGUSR1 tells zift to close its current audit-log fd and open a
    # fresh one against the (now-rotated) path. Without this hook,
    # zift would keep writing into the inode that logrotate just
    # renamed to audit.jsonl.1 — the new audit.jsonl would never get
    # any lines.
    postrotate
        systemctl kill -s USR1 zift
    endscript
}
