# fail2ban filter for Zift SFTP audit log
#
# Zift's audit log emits one JSON line per auth attempt. The "result":"denied"
# field identifies failed attempts. The "ip" field always contains the peer IP.
#
# Install:
#   sudo cp fail2ban-zift.conf /etc/fail2ban/filter.d/zift.conf
#   Then add a jail in /etc/fail2ban/jail.local (see below).
#
# Example jail configuration (/etc/fail2ban/jail.local):
#
#   [zift]
#   enabled  = true
#   port     = 2222
#   filter   = zift
#   logpath  = /var/log/zift/audit.jsonl
#   maxretry = 5
#   bantime  = 3600
#   findtime = 600
#

[Definition]
failregex = "result":"denied".*"ip":"<HOST>"
ignoreregex =
