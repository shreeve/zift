# fail2ban filter for Zift SFTP audit log.
#
# We deliberately match ONLY auth-layer failures (auth.password,
# auth.publickey, accept.rejected, handshake.failed) and the per-
# connection "auth.too_many_attempts" tripwire. Policy-layer denials
# (a legitimate partner hitting `deny /elsewhere`) MUST NOT trigger
# bans — those are normal access-control events that an authenticated
# user produces during ordinary use.
#
# Field-order assumption: zift writes JSON with the stable
# time/event/user/operation/result/path/detail/ip order documented
# in audit.zig (v0.7.0+ leads with `time`). The regex matches
# `operation` first, then `result`, then `ip` because those three
# are always present in that order.
#
# Install:
#   sudo cp fail2ban-zift.conf /etc/fail2ban/filter.d/zift.conf
#   Then add a jail in /etc/fail2ban/jail.local (see below).
#
# Example jail configuration (/etc/fail2ban/jail.local):
#
#   [zift]
#   enabled  = true
#   port     = 2222
#   filter   = zift
#   logpath  = /home/zift/audit.jsonl
#   maxretry = 5
#   bantime  = 3600
#   findtime = 600
#

[Definition]
failregex = "operation":"(?:auth\.password|auth\.publickey|auth\.too_many_attempts|accept\.rejected|handshake\.failed)","result":"(?:denied|failed)".*?"ip":"<HOST>"
# v0.7.0+ — every audit line leads with an RFC 3339 UTC ms
# timestamp (`"time":"YYYY-MM-DDTHH:MM:SS.mmmZ"`). Telling fail2ban
# to read time from the line itself (instead of falling back on
# file mtime) gives the findtime/bantime window the actual event
# time, even if log-shipping defers writes or the file is rotated.
#
# `%f` is fail2ban's sub-second token (matches the 3-digit ms our
# audit pipeline emits, accepts microseconds too). `\.` escapes
# the literal dot inside the date-template regex. Verify after
# install with: `fail2ban-regex /home/zift/audit.jsonl
# /etc/fail2ban/filter.d/zift.conf`. If the template doesn't
# match on your fail2ban version, comment this line out — fail2ban
# falls back to file mtime, which is still good enough for the
# default findtime window.
datepattern = "time":"%Y-%m-%dT%H:%M:%S\.%fZ"
ignoreregex =
