# fail2ban jail for Zift.
#
# Install: append this block to /etc/fail2ban/jail.local. If that file
# doesn't exist yet:
#
#   sudo install -m 0644 fail2ban-zift-jail.conf /etc/fail2ban/jail.local
#
# Or to add to an existing jail.local:
#
#   sudo tee -a /etc/fail2ban/jail.local < fail2ban-zift-jail.conf
#
# The matching filter file (the regex that recognizes a "ban-worthy"
# audit line) is `fail2ban-zift-filter.conf` in this same directory;
# it installs to `/etc/fail2ban/filter.d/zift.conf`.
#
# After installing both files:
#
#   sudo fail2ban-client -t            # syntax check
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status zift   # confirm File list: /home/zift/audit.jsonl

[zift]
enabled  = true
# `polling` (re-stat the file every few seconds) is required on
# Debian/Ubuntu where fail2ban's `auto` backend defaults to systemd-
# journald — that ignores `logpath` and watches the journal instead,
# which would never see zift's audit JSON. `pyinotify` also works if
# you prefer event-driven; both are fine.
backend  = polling
port     = 2222
filter   = zift
logpath  = /home/zift/audit.jsonl
# Five auth-layer failures within 10 minutes triggers a 1-hour ban.
# Tune for your partner traffic patterns: legitimate clients with
# rotating passwords / typo'd keys can hit ~3 failures during a
# config push; 5 leaves headroom.
maxretry  = 5
findtime  = 600
bantime   = 3600
