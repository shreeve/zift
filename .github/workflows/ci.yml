name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Run unit tests
        run: zig build test

  build-release-safe:
    name: Build (ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Build the same fully-static x86_64-linux-musl binary that we
      # ship as a release artifact. No `libssh-dev` install needed —
      # libssh, mbedTLS, and zlib are all vendored and built from
      # source via build.zig.zon. Static-musl matches the binary
      # downstream users actually run, so CI tests exercise the
      # same artifact rather than a dynamic-glibc variant that only
      # CI ever sees. (v0.5.2 and earlier built dynamic-glibc; the
      # mismatch hid the v0.4.0+ raw-syscall errno bug for several
      # releases — fixed in v0.5.3.)
      - name: Build ReleaseSafe (static musl)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl

      - name: Verify binary exists
        run: test -f bin/zift

      - name: Verify fully static (zero DT_NEEDED entries)
        run: |
          echo "=== Binary size ==="
          ls -lh bin/zift
          # Static-musl binaries must have ZERO direct NEEDED entries —
          # libssh, mbedTLS, zlib, and musl libc are all linked in.
          # If anything shows up in DT_NEEDED, the build picked up an
          # unintended dynamic dependency.
          echo "=== Direct NEEDED entries ==="
          needed=$(objdump -p bin/zift | awk '/NEEDED/ {print $2}' | sort -u)
          if [ -n "$needed" ]; then
            echo "$needed" | sed 's/^/  /'
            echo
            echo "FAIL: static binary should have zero DT_NEEDED entries."
            exit 1
          fi
          echo "  (zero entries — fully static)"

      - name: Verify systemd unit (catch inline-comment & directive bugs)
        run: |
          # systemd-analyze verify catches the class of bug where a
          # directive line carries a trailing inline comment (which
          # systemd parses as part of the value, fails to interpret,
          # and silently leaves the directive at its compile-time
          # default — a stealth weakening of the unit's hardening).
          #
          # We fail on:
          #   - any non-zero exit code from `systemd-analyze verify`
          #   - any output at all on stdout/stderr
          # systemd is preinstalled on ubuntu-latest images, so the
          # tool is already on $PATH. The fall-through install is a
          # safety net for runners that drop it.
          command -v systemd-analyze >/dev/null \
            || sudo apt-get install -y --no-install-recommends systemd

          # `systemd-analyze verify` walks the unit's [Install] deps,
          # which expects the unit to live under a system path. Drop
          # a copy in a per-run private tmpdir so dependency resolution
          # succeeds without touching /etc and without colliding with
          # any stale artifact at a predictable /tmp path.
          #
          # We also rewrite `ExecStart` to `/bin/true` for the verify
          # copy. The verifier checks that the ExecStart path actually
          # exists and is executable on the host running verify; on a
          # CI runner where zift isn't installed the unit-file syntax
          # is correct but the path check fails. We're verifying the
          # SHIPPED unit's directive syntax (hardening, capabilities,
          # etc.), not the deployment-specific binary path.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          sed 's|^ExecStart=.*|ExecStart=/bin/true|' packaging/systemd/zift.service > "$tmpdir/zift.service"

          set +e
          out=$(systemd-analyze verify "$tmpdir/zift.service" 2>&1)
          rc=$?
          set -e

          if [ "$rc" -ne 0 ] || [ -n "$out" ]; then
            echo "FAIL: systemd-analyze verify reported issues:"
            echo "$out" | sed 's/^/  /'
            echo "  exit code: $rc"
            exit 1
          fi
          echo "systemd-analyze verify clean."

      - name: Smoke test (version)
        run: bin/zift version

      - name: Smoke test (validate)
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_host_ed25519 -N "" -q
          mkdir -p /tmp/ci_root
          printf '%s\n' 'testpw' | bin/zift hash-password > /tmp/ci_hash.txt
          HASH=$(cat /tmp/ci_hash.txt)
          cat > /tmp/ci.zift <<EOF
          server
            listen 127.0.0.1:2222
            host-key /tmp/ci_host_ed25519
            log stderr

          user ci
            auth $HASH
            root /tmp/ci_root
            allow / read list
          EOF
          bin/zift validate /tmp/ci.zift

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zift-linux-amd64-release-safe
          path: bin/zift

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-release-safe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zift-linux-amd64-release-safe
          path: bin

      - name: Make binary executable
        run: chmod +x bin/zift

      - name: Install test dependencies
        run: |
          # No `libssh-4` — zift is a static-musl binary with libssh
          # vendored in. Test harnesses still need expect/openssh/python.
          sudo apt-get update
          sudo apt-get install -y expect openssh-client python3-venv lsof
          python3 -m venv tests/.venv
          tests/.venv/bin/pip install paramiko

      - name: Run integration tests
        run: |
          export PATH="$PWD/bin:$PATH"
          bash tests/run.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: tests/tmp/
          if-no-files-found: ignore

  fuzz-short:
    name: Short fuzz run
    runs-on: ubuntu-latest
    # Zig 0.16.0's Debug `--fuzz` test runner hits a StackTrace type
    # mismatch upstream. ReleaseSafe uses the LLVM fuzz path and
    # builds cleanly — keep that until a patched Zig is pinned.
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Fuzz (60s cap)
        run: |
          # `timeout` exits 124 on its own kill — the only failure mode
          # we want to swallow. Any other non-zero (compile error, real
          # crash, fuzz finding) must fail the job.
          set +e
          timeout 60 zig build test -Doptimize=ReleaseSafe --fuzz
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "Fuzz run completed (rc=$rc, 60s cap)"
            exit 0
          else
            echo "Fuzz run failed (rc=$rc)"
            exit "$rc"
          fi
