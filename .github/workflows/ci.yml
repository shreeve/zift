name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Run unit tests
        run: zig build test

  build-release-safe:
    name: Build (ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

      - name: Verify binary exists
        run: test -f bin/zift

      - name: Check direct dynamic dependencies (NEEDED allowlist)
        run: |
          echo "=== Full dynamic resolution (informational) ==="
          ldd bin/zift || true
          echo "=== Binary size ==="
          ls -lh bin/zift

          # Assert the *direct* NEEDED entries on the binary, not the
          # full transitive resolution that `ldd` reports. libssh on
          # Ubuntu pulls libgssapi-krb5-2, libkrb5-3, libcom_err.so.2,
          # libk5crypto.so.3, libkeyutils.so.1 etc. transitively — those
          # are libssh's choice, not ours, and they shift across distro
          # upgrades. What we genuinely control is what *our* binary
          # has in its DT_NEEDED entries, which is short and stable.
          echo "=== Direct NEEDED entries ==="
          needed=$(objdump -p bin/zift \
            | awk '/NEEDED/ {print $2}' \
            | sort -u)
          echo "$needed" | sed 's/^/  /'

          # The dynamic loader (`ld-linux-*.so.[12]`) is technically the
          # binary's `PT_INTERP` entry, but on Linux/Zig 0.16 builds it
          # ALSO shows up as a `DT_NEEDED`. The CI on 2026-04-27 failed
          # because we'd dropped it from the allowlist based on the
          # PT_INTERP-only assumption; empirically Zig emits it in both
          # places. Keep it in the allowlist until/unless a future Zig
          # release stops emitting the redundant DT_NEEDED.
          allowed='libssh\.so\.4|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libm\.so\.6|libgcc_s\.so\.1|ld-linux-x86-64\.so\.2|ld-linux-aarch64\.so\.1'
          unexpected=$(echo "$needed" | grep -Ev "^(${allowed})$" || true)
          if [ -n "$unexpected" ]; then
            echo
            echo "FAIL: NEEDED entries outside the allowlist:"
            echo "$unexpected" | sed 's/^/  /'
            echo
            echo "Either the binary picked up a new system library (build"
            echo "regression) or the allowlist needs updating to match a"
            echo "deliberate change in our dependency surface."
            exit 1
          fi
          echo "All NEEDED entries are on the allowlist."

      - name: Verify systemd unit (catch inline-comment & directive bugs)
        run: |
          # systemd-analyze verify catches the class of bug where a
          # directive line carries a trailing inline comment (which
          # systemd parses as part of the value, fails to interpret,
          # and silently leaves the directive at its compile-time
          # default — a stealth weakening of the unit's hardening).
          #
          # We fail on:
          #   - any non-zero exit code from `systemd-analyze verify`
          #   - any output at all on stdout/stderr
          # systemd is preinstalled on ubuntu-latest images, so the
          # tool is already on $PATH. The fall-through install is a
          # safety net for runners that drop it.
          command -v systemd-analyze >/dev/null \
            || sudo apt-get install -y --no-install-recommends systemd

          # `systemd-analyze verify` walks the unit's [Install] deps,
          # which expects the unit to live under a system path. Drop
          # a copy in a per-run private tmpdir so dependency resolution
          # succeeds without touching /etc and without colliding with
          # any stale artifact at a predictable /tmp path.
          #
          # We also rewrite `ExecStart` to `/bin/true` for the verify
          # copy. The verifier checks that the ExecStart path actually
          # exists and is executable on the host running verify; on a
          # CI runner where zift isn't installed the unit-file syntax
          # is correct but the path check fails. We're verifying the
          # SHIPPED unit's directive syntax (hardening, capabilities,
          # etc.), not the deployment-specific binary path.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          sed 's|^ExecStart=.*|ExecStart=/bin/true|' deploy/zift.service > "$tmpdir/zift.service"

          set +e
          out=$(systemd-analyze verify "$tmpdir/zift.service" 2>&1)
          rc=$?
          set -e

          if [ "$rc" -ne 0 ] || [ -n "$out" ]; then
            echo "FAIL: systemd-analyze verify reported issues:"
            echo "$out" | sed 's/^/  /'
            echo "  exit code: $rc"
            exit 1
          fi
          echo "systemd-analyze verify clean."

      - name: Smoke test (version)
        run: bin/zift version

      - name: Smoke test (validate)
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_host_ed25519 -N "" -q
          mkdir -p /tmp/ci_root
          printf '%s\n' 'testpw' | bin/zift hash-password > /tmp/ci_hash.txt
          HASH=$(cat /tmp/ci_hash.txt)
          cat > /tmp/ci.zift <<EOF
          server
            listen 127.0.0.1:2222
            host-key /tmp/ci_host_ed25519
            log stderr

          user ci
            password $HASH
            root /tmp/ci_root
            allow / read list
          EOF
          bin/zift validate /tmp/ci.zift

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zift-linux-amd64-release-safe
          path: bin/zift

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-release-safe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zift-linux-amd64-release-safe
          path: bin

      - name: Make binary executable
        run: chmod +x bin/zift

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect openssh-client python3-venv lsof libssh-4
          python3 -m venv test/.venv
          test/.venv/bin/pip install paramiko

      - name: Run integration tests
        run: |
          export PATH="$PWD/bin:$PATH"
          bash test/run.sh

  fuzz-short:
    name: Short fuzz run
    runs-on: ubuntu-latest
    # Disabled pending an upstream Zig fix.
    #
    # Zig 0.16.0's `compiler/test_runner.zig` mixes two distinct
    # `StackTrace` types (`std.builtin.StackTrace` vs.
    # `std.debug.StackTrace`) when invoked with `--fuzz`. The compile
    # fails with:
    #     test_runner.zig:566: error: expected type
    #     '*const debug.StackTrace', found '*builtin.StackTrace'
    # …and the fuzz binary can't be built at all, regardless of our
    # harness code. The harnesses themselves run fine in non-fuzz
    # mode (each runs once with empty input) and are exercised by
    # the `unit-tests` job above. Only the random-input generation
    # pass is missing until Zig ships a stdlib fix; track upstream
    # and flip this back to `if: true` (or remove the gate) when a
    # patched Zig release is pinned in `ZIG_VERSION`.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Fuzz (60s cap)
        run: |
          # `timeout` exits 124 on its own kill — the only failure mode
          # we want to swallow. Any other non-zero (compile error, real
          # crash, fuzz finding) must fail the job.
          set +e
          timeout 60 zig build test --fuzz
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "Fuzz run completed (rc=$rc, 60s cap)"
            exit 0
          else
            echo "Fuzz run failed (rc=$rc)"
            exit "$rc"
          fi
