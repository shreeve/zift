name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Run unit tests
        run: zig build test

  build-release-safe:
    name: Build (ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

      - name: Verify binary exists
        run: test -f zig-out/bin/zift

      - name: Check dynamic dependencies (allowlist assertion)
        run: |
          echo "=== Dynamic dependencies ==="
          ldd zig-out/bin/zift
          echo "=== Binary size ==="
          ls -lh zig-out/bin/zift

          # Allowlist for an ubuntu-latest ReleaseSafe build linked
          # against apt's libssh-dev. Anything outside this set is a
          # build-system regression we want CI to surface immediately
          # (e.g. a new Zig stdlib that pulled in something we did not
          # intend to ship dynamically). The list intentionally omits
          # `linux-vdso.so.1` and the loader (`/lib64/ld-linux-*`)
          # because those are not `=> /path` resolutions in `ldd`.
          allowed='libssh\.so\.4|libcrypto\.so\.3|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libm\.so\.6|libgcc_s\.so\.1|libz\.so\.1|libssl\.so\.3'
          unexpected=$(ldd zig-out/bin/zift \
            | awk '/=>/ {print $1}' \
            | sort -u \
            | grep -Ev "^(${allowed})$" || true)
          if [ -n "$unexpected" ]; then
            echo
            echo "FAIL: dynamic dependencies outside the allowlist:"
            echo "$unexpected" | sed 's/^/  /'
            echo
            echo "Either the binary picked up a new system library (build"
            echo "regression) or the allowlist needs updating to match a"
            echo "deliberate change in our dependency surface."
            exit 1
          fi
          echo "All dynamic deps are on the allowlist."

      - name: Smoke test (version)
        run: zig-out/bin/zift version

      - name: Smoke test (validate)
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_host_ed25519 -N "" -q
          mkdir -p /tmp/ci_root
          printf '%s\n' 'testpw' | zig-out/bin/zift hash-password > /tmp/ci_hash.txt
          HASH=$(cat /tmp/ci_hash.txt)
          cat > /tmp/ci.zift <<EOF
          server
            listen 127.0.0.1:2222
            host-key /tmp/ci_host_ed25519
            log stderr

          user ci
            password $HASH
            root /tmp/ci_root
            allow / read list
          EOF
          zig-out/bin/zift validate /tmp/ci.zift

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zift-linux-amd64-release-safe
          path: zig-out/bin/zift

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-release-safe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zift-linux-amd64-release-safe
          path: zig-out/bin

      - name: Make binary executable
        run: chmod +x zig-out/bin/zift

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect openssh-client python3-venv lsof libssh-4
          python3 -m venv test/.venv
          test/.venv/bin/pip install paramiko

      - name: Run integration tests
        run: |
          export PATH="$PWD/zig-out/bin:$PATH"
          bash test/run.sh

  fuzz-short:
    name: Short fuzz run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install libssh
        run: sudo apt-get update && sudo apt-get install -y libssh-dev

      - name: Fuzz (60s cap)
        run: |
          # `timeout` exits 124 on its own kill — the only failure mode
          # we want to swallow. Any other non-zero (compile error, real
          # crash, fuzz finding) must fail the job.
          set +e
          timeout 60 zig build test --fuzz
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "Fuzz run completed (rc=$rc, 60s cap)"
            exit 0
          else
            echo "Fuzz run failed (rc=$rc)"
            exit "$rc"
          fi
