name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check src tools build.zig

      - name: Run unit tests (native)
        run: zig build test

      # The shipped Linux binary links musl, not the runner's glibc. An
      # errno difference between the two once hid a bug for several
      # releases (fixed in v0.5.3), so the tests also run against musl.
      - name: Run unit tests (x86_64-linux-musl)
        if: runner.os == 'Linux'
        run: zig build test -Dtarget=x86_64-linux-musl

  build:
    name: Release build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
            artifact: zift-ci-x86_64-linux
          - os: macos-latest
            target: aarch64-macos
            artifact: zift-ci-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      # Exactly what release.yml runs, so the integration jobs test the
      # kind of binary that ships: ReleaseSafe, stripped, static-PIE on
      # Linux, and checked by tools/verify.zig (zero DT_NEEDED and no
      # PT_INTERP on Linux, libSystem only on macOS).
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          zig build release -Dversion=ci -Dtarget="$TARGET"
          mkdir -p bin
          cp "release/$ARTIFACT" bin/zift
          ls -l bin/zift

      - name: Verify systemd unit (catch inline-comment & directive bugs)
        if: runner.os == 'Linux'
        run: |
          # systemd-analyze verify catches the class of bug where a
          # directive line carries a trailing inline comment (which
          # systemd parses as part of the value, fails to interpret,
          # and silently leaves the directive at its compile-time
          # default — a stealth weakening of the unit's hardening).
          #
          # We fail on:
          #   - any non-zero exit code from `systemd-analyze verify`
          #   - any output at all on stdout/stderr
          # systemd is preinstalled on ubuntu-latest images, so the
          # tool is already on $PATH. The fall-through install is a
          # safety net for runners that drop it.
          command -v systemd-analyze >/dev/null \
            || sudo apt-get install -y --no-install-recommends systemd

          # `systemd-analyze verify` walks the unit's [Install] deps,
          # which expects the unit to live under a system path. Drop
          # a copy in a per-run private tmpdir so dependency resolution
          # succeeds without touching /etc and without colliding with
          # any stale artifact at a predictable /tmp path.
          #
          # Every Exec* line that invokes the zift binary is rewritten
          # to `/bin/true` for the verify copy: the verifier checks
          # that each command path exists on the host running it, and
          # zift is not installed on the runner. This verifies the
          # SHIPPED unit's directive syntax, not the deployment's
          # binary path. `ExecReload=/bin/kill` exists, so it stays.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          sed -E 's|^(Exec[A-Za-z]*=)/usr/local/bin/zift.*|\1/bin/true|' packaging/systemd/zift.service > "$tmpdir/zift.service"

          set +e
          out=$(systemd-analyze verify "$tmpdir/zift.service" 2>&1)
          rc=$?
          set -e

          if [ "$rc" -ne 0 ] || [ -n "$out" ]; then
            echo "FAIL: systemd-analyze verify reported issues:"
            echo "$out" | sed 's/^/  /'
            echo "  exit code: $rc"
            exit 1
          fi
          echo "systemd-analyze verify clean."

      - name: Smoke test (version)
        run: bin/zift version

      - name: Smoke test (validate)
        run: |
          work=$(mktemp -d)
          ssh-keygen -t ed25519 -f "$work/host_ed25519" -N "" -q
          mkdir -p "$work/root"
          HASH=$(printf '%s\n' 'testpw' | bin/zift hash-password)
          cat > "$work/ci.zift" <<EOF
          server
            listen 127.0.0.1:2222
            host-key $work/host_ed25519
            log stderr

          user ci
            auth $HASH
            root $work/root
            allow / read list
          EOF
          bin/zift validate "$work/ci.zift"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zift-${{ matrix.os }}
          path: bin/zift
          if-no-files-found: error

  integration-tests:
    name: Integration tests (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A case whose prerequisites are missing fails instead of skipping.
      ZIFT_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zift-${{ matrix.os }}
          path: bin

      - name: Make binary executable
        run: chmod +x bin/zift

      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect openssh-client python3-venv lsof

      # macOS runners already have expect, the OpenSSH client and lsof.
      - name: Create paramiko venv
        run: |
          python3 -m venv tests/.venv
          tests/.venv/bin/pip install paramiko

      # No Zig in this job: tests/run.sh's `zig build` then fails
      # harmlessly and the suite runs the downloaded release binary.
      # The checksum comparison proves the binary under test was not
      # replaced by a local debug build.
      - name: Run integration tests
        run: |
          before=$(shasum -a 256 bin/zift)
          export PATH="$PWD/bin:$PATH"
          bash tests/run.sh
          after=$(shasum -a 256 bin/zift)
          if [ "$before" != "$after" ]; then
            echo "FAIL: bin/zift changed during the run; the suite did not test the release binary"
            exit 1
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-logs-${{ matrix.os }}
          path: tests/tmp/
          if-no-files-found: ignore

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Zig 0.16.0's Debug `--fuzz` test runner hits a StackTrace type
    # mismatch upstream. ReleaseSafe uses the LLVM fuzz path and
    # builds cleanly — keep that until a patched Zig is pinned.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      # A fixed iteration budget instead of a wall-clock cap, so a slow
      # compile can never be mistaken for a fuzz run, and anything but
      # a clean exit (compile error, crash, finding) fails the job.
      # 100K took about 90 s locally after compiling.
      - name: Fuzz
        run: zig build test -Doptimize=ReleaseSafe --fuzz=200K
